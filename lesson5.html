<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5과 발음 연습</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faffff,#eef6fb);font-family:"Noto Sans KR",system-ui,sans-serif;color:#172c40}.app{max-width:820px;margin:auto;padding:18px}a{color:#08746b;font-weight:800;text-decoration:none}.hero,.box,.person{background:#fff;border:1px solid #d9e5ea;border-radius:24px;padding:20px;box-shadow:0 8px 24px #23445315}.hero{margin:14px 0;background:#edfffb}.tag{display:inline-block;background:#c9f5ec;padding:7px 12px;border-radius:99px;font-weight:900}h1{margin:10px 0 5px;font-size:30px}.hero p{color:#637789;font-weight:700}.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.person.active{border:3px solid #f5bf20}.person.dim{opacity:.5}.person b{font-size:21px}.task{margin-top:10px;background:#fff2b8;border-radius:15px;padding:12px;font-weight:800}.box{margin-bottom:14px}#target{font-size:27px;font-weight:900;line-height:1.5;margin:12px 0}.syllables{display:flex;flex-wrap:wrap;gap:7px;background:#fafcff;border:1px solid #dce5ff;border-radius:18px;padding:13px}.syl{min-width:43px;border:2px solid #cdd8e0;border-radius:13px;padding:7px;text-align:center;font-weight:900;font-size:21px}.syl i{display:block;font-style:normal;font-size:13px;color:#788b98}.syl.ok{background:#eafff2;border-color:#68d99e}.syl.ok i{color:#079953}.syl.bad{background:#fff0f0;border-color:#ee9999}.syl.bad i{color:#d93636}.gap{width:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}button{border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px}.listen{background:#dff7f1;color:#08746b}.speak{background:#ed174b;color:#fff}.manual{background:#fff;border:1px solid #d5e0e5;color:#40566a;grid-column:1/-1}#inputrow{display:none;margin-top:10px;gap:8px}input{flex:1;padding:12px;border:1px solid #cad8df;border-radius:13px}#result{display:none;margin-top:13px;border-radius:16px;padding:14px;background:#f0fbf5;font-weight:800}#next{display:none;margin-top:10px;background:#078b80;color:#fff;width:100%}.progress{font-weight:900;text-align:right}@media(max-width:600px){.people{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.manual{grid-column:auto}}</style></head><body><div class="app">
<a href="index.html">← 단원 선택</a><section class="hero"><span class="tag">5과 · 생일이 며칠이에요?</span><h1>문장을 보고 정확하게 말해요</h1><p>제이슨과 이링이 되어 생일 날짜와 요일을 묻고 대답해 보세요.</p><div class="progress" id="prog"></div></section>
<div class="people"><div id="pa" class="person"><b>제이슨</b><div id="ta" class="task"></div></div><div id="pb" class="person"><b>이링</b><div id="tb" class="task"></div></div></div>
<section class="box"><span class="tag" id="turn"></span><div id="target"></div><div class="syllables" id="syllables"></div>
<div class="buttons"><button class="listen" onclick="model()">🔊 모범 문장 듣기</button><button class="speak" onclick="recognize()">🎤 말하기 시작</button><button class="manual" onclick="manual()">⌨️ 직접 입력</button></div>
<div id="inputrow"><input id="inp" placeholder="말한 문장을 입력하세요"><button class="listen" onclick="check(inp.value)">확인</button></div><div id="result"></div><button id="next" onclick="next()">다음 차례 →</button></section></div>
<script>const turns=[{"speaker": "A", "name": "제이슨", "target": "이링 씨, 생일이 몇 월 며칠이에요?"}, {"speaker": "B", "name": "이링", "target": "5월 16일이에요."}, {"speaker": "A", "name": "제이슨", "target": "그날이 금요일이에요?"}, {"speaker": "B", "name": "이링", "target": "아니요, 금요일이 아니에요. 토요일이에요."}, {"speaker": "B", "name": "이링", "target": "제 생일에 같이 밥 먹어요."}];let n=0;
const clean=s=>(s||"").replace(/[.,!?~…]/g,"").replace(/\s+/g," ").trim(), chars=s=>[...clean(s).replace(/\s/g,"")];
function alignment(t,s){let a=chars(t),b=chars(s),d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=a.length,j=b.length,r=[];while(i||j){if(i&&j&&d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){r.push({ok:a[i-1]===b[j-1]});i--;j--}else if(i&&d[i][j]===d[i-1][j]+1){r.push({ok:false});i--}else j--}return r.reverse()}
function boxes(r){let e=syllables;e.innerHTML="";let k=0;for(let c of clean(turns[n].target)){if(c===" "){e.insertAdjacentHTML("beforeend",'<span class="gap"></span>');continue}let q=r?r[k++]:null;e.insertAdjacentHTML("beforeend",`<span class="syl ${q?(q.ok?"ok":"bad"):""}"><i>${q?(q.ok?"O":"X"):"·"}</i>${c}</span>`)}}
function render(){let t=turns[n];prog.textContent=`${n+1} / ${turns.length}`;turn.textContent=t.name+" 차례";target.textContent=t.target;pa.className="person "+(t.speaker==="A"?"active":"dim");pb.className="person "+(t.speaker==="B"?"active":"dim");ta.textContent=t.speaker==="A"?"말하기 시작":"상대의 차례를 기다리세요.";tb.textContent=t.speaker==="B"?"말하기 시작":"상대의 차례를 기다리세요.";boxes();result.style.display="none";next.style.display="none";inputrow.style.display="none"}
function model(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(turns[n].target);u.lang="ko-KR";u.rate=.82;speechSynthesis.speak(u)}
function manual(){inputrow.style.display=inputrow.style.display==="flex"?"none":"flex"}
function recognize(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("이 브라우저는 음성 인식을 지원하지 않습니다. 직접 입력을 이용해 주세요.");return}let r=new R();r.lang="ko-KR";r.onresult=e=>check(e.results[0][0].transcript);r.start()}
function check(s){if(!s)return;let r=alignment(turns[n].target,s),score=Math.round(r.filter(x=>x.ok).length/r.length*100);boxes(r);result.style.display="block";result.textContent=`인식 문장: ${s} · ${score}점 — `+(score>=90?"아주 좋아요!":score>=70?"X 음절을 더 또박또박 말해 보세요.":"모범 문장을 듣고 다시 천천히 말해 보세요.");next.style.display="block"}
function next(){if(n<turns.length-1){n++;render();scrollTo({top:0,behavior:"smooth"})}else{alert("5과 연습을 모두 마쳤어요!");location.href="index.html"}}render();</script></body></html>
