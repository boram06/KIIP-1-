<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6과 발음 연습</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faffff,#eef6fb);font-family:"Noto Sans KR",system-ui,sans-serif;color:#172c40}.app{max-width:820px;margin:auto;padding:18px}a{color:#08746b;font-weight:800;text-decoration:none}.hero,.box,.person{background:#fff;border:1px solid #d9e5ea;border-radius:24px;padding:20px;box-shadow:0 8px 24px #23445315}.hero{margin:14px 0;background:#edfffb}.tag{display:inline-block;background:#c9f5ec;padding:7px 12px;border-radius:99px;font-weight:900}h1{margin:10px 0 5px;font-size:30px}.hero p{color:#637789;font-weight:700}.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.person.active{border:3px solid #f5bf20}.person.dim{opacity:.5}.person b{font-size:21px}.task{margin-top:10px;background:#fff2b8;border-radius:15px;padding:12px;font-weight:800}.box{margin-bottom:14px}#target{font-size:27px;font-weight:900;line-height:1.5;margin:12px 0}.syllables{display:flex;flex-wrap:wrap;gap:7px;background:#fafcff;border:1px solid #dce5ff;border-radius:18px;padding:13px}.syl{min-width:43px;border:2px solid #cdd8e0;border-radius:13px;padding:7px;text-align:center;font-weight:900;font-size:21px}.syl i{display:block;font-style:normal;font-size:13px;color:#788b98}.syl.ok{background:#eafff2;border-color:#68d99e}.syl.ok i{color:#079953}.syl.bad{background:#fff0f0;border-color:#ee9999}.syl.bad i{color:#d93636}.gap{width:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}button{border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px}.listen{background:#dff7f1;color:#08746b}.speak{background:#ed174b;color:#fff}.manual{background:#fff;border:1px solid #d5e0e5;color:#40566a;grid-column:1/-1}#inputrow{display:none;margin-top:10px;gap:8px}input{flex:1;padding:12px;border:1px solid #cad8df;border-radius:13px}#result{display:none;margin-top:13px;border-radius:16px;padding:14px;background:#f0fbf5;font-weight:800}#next{display:none;margin-top:10px;background:#078b80;color:#fff;width:100%}.progress{font-weight:900;text-align:right}@media(max-width:600px){.people{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.manual{grid-column:auto}}</style></head><body><div class="app">
<a href="index.html">← 단원 선택</a><section class="hero"><span class="tag">6과 · 주말에 뭐 해요?</span><h1>문장을 보고 정확하게 말해요</h1><p>동료와 안젤라가 되어 주말 활동과 시간을 묻고 대답해 보세요.</p><div class="progress" id="prog"></div></section>
<div class="people"><div id="pa" class="person"><b>동료</b><div id="ta" class="task"></div></div><div id="pb" class="person"><b>안젤라</b><div id="tb" class="task"></div></div></div>
<section class="box"><span class="tag" id="turn"></span><div id="target"></div><div class="syllables" id="syllables"></div>
<div class="buttons"><button class="listen" onclick="model()">🔊 모범 문장 듣기</button><button class="speak" onclick="recognize()">🎤 말하기 시작</button><button class="manual" onclick="manual()">⌨️ 직접 입력</button></div>
<div id="inputrow"><input id="inp" placeholder="말한 문장을 입력하세요"><button class="listen" onclick="check(el.inp.value)">확인</button></div><div id="result"></div><button id="nextBtn" onclick="nextTurn()">다음 차례 →</button></section></div>
<script>const turns=[{"speaker": "A", "name": "동료", "target": "안젤라 씨, 주말에 일해요?"}, {"speaker": "B", "name": "안젤라", "target": "아니요, 일 안 해요. 주말에 한국어를 배워요."}, {"speaker": "A", "name": "동료", "target": "몇 시부터 몇 시까지 배워요?"}, {"speaker": "B", "name": "안젤라", "target": "10시부터 12시까지 배워요."}];let n=0;
const el={
 prog:document.getElementById("prog"), turn:document.getElementById("turn"), target:document.getElementById("target"),
 pa:document.getElementById("pa"), pb:document.getElementById("pb"), ta:document.getElementById("ta"), tb:document.getElementById("tb"),
 syllables:document.getElementById("syllables"), result:document.getElementById("result"), nextBtn:document.getElementById("nextBtn"),
 inputrow:document.getElementById("inputrow"), inp:document.getElementById("inp")
};
const clean=s=>(s||"").replace(/[.,!?~…]/g,"").replace(/\s+/g," ").trim(), chars=s=>[...clean(s).replace(/\s/g,"")];
function alignment(t,s){let a=chars(t),b=chars(s),d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=a.length,j=b.length,r=[];while(i||j){if(i&&j&&d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){r.push({ok:a[i-1]===b[j-1]});i--;j--}else if(i&&d[i][j]===d[i-1][j]+1){r.push({ok:false});i--}else j--}return r.reverse()}
function boxes(r){let e=el.syllables;e.innerHTML="";let k=0;for(let c of clean(turns[n].target)){if(c===" "){e.insertAdjacentHTML("beforeend",'<span class="gap"></span>');continue}let q=r?r[k++]:null;e.insertAdjacentHTML("beforeend",`<span class="syl ${q?(q.ok?"ok":"bad"):""}"><i>${q?(q.ok?"O":"X"):"·"}</i>${c}</span>`)}}
function render(){let t=turns[n];el.prog.textContent=`${n+1} / ${turns.length}`;el.turn.textContent=t.name+" 차례";el.target.textContent=t.target;el.pa.className="person "+(t.speaker==="A"?"active":"dim");el.pb.className="person "+(t.speaker==="B"?"active":"dim");el.ta.textContent=t.speaker==="A"?"말하기 시작":"상대의 차례를 기다리세요.";el.tb.textContent=t.speaker==="B"?"말하기 시작":"상대의 차례를 기다리세요.";boxes();el.result.style.display="none";el.nextBtn.style.display="none";el.inputrow.style.display="none"}
function model(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(turns[n].target);u.lang="ko-KR";u.rate=.82;speechSynthesis.speak(u)}
function manual(){el.inputrow.style.display=el.inputrow.style.display==="flex"?"none":"flex"}
function recognize(){
 let R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){alert("이 브라우저에서는 음성 인식이 지원되지 않습니다. Chrome 또는 Samsung Internet에서 열거나 직접 입력을 이용해 주세요.");return}
 try{
  let r=new R(); r.lang="ko-KR"; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
  el.result.style.display="block"; el.result.textContent="듣고 있어요. 문장을 천천히 말해 주세요.";
  r.onresult=e=>{let said=e.results?.[0]?.[0]?.transcript||""; if(said) check(said); else {el.result.textContent="음성을 인식하지 못했어요. 다시 말해 보세요."}};
  r.onerror=e=>{el.result.style.display="block"; el.result.textContent=e.error==="not-allowed"?"마이크 권한이 필요해요. 브라우저에서 마이크 사용을 허용한 뒤 다시 눌러 주세요.":"음성을 인식하지 못했어요. 다시 말해 보거나 직접 입력을 이용해 주세요."};
  r.onnomatch=()=>{el.result.style.display="block";el.result.textContent="음성을 인식하지 못했어요. 다시 천천히 말해 보세요."};
  r.start();
 }catch(e){alert("음성 인식을 시작하지 못했어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.")}
}
function check(s){if(!s)return;let r=alignment(turns[n].target,s),score=Math.round(r.filter(x=>x.ok).length/r.length*100);boxes(r);el.result.style.display="block";el.result.textContent=`인식 문장: ${s} · ${score}점 — `+(score>=90?"아주 좋아요!":score>=70?"X 음절을 더 또박또박 말해 보세요.":"모범 문장을 듣고 다시 천천히 말해 보세요.");el.nextBtn.style.display="block"}
function nextTurn(){if(n<turns.length-1){n++;render();scrollTo({top:0,behavior:"smooth"})}else{alert("6과 연습을 모두 마쳤어요!");location.href="index.html"}}render();</script></body></html>
